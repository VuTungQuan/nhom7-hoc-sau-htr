<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập – Nhận dạng chữ viết tay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f4f5f7; --card:#fff; --fg:#17181c; --muted:#62656e; --line:#e2e4e9; --soft:#f0f2f6; --acc:#2457d6; --acc-fg:#fff; --err:#b42318; --err-soft:#fef3f2;
          --shadow:0 1px 2px rgba(16,24,40,.05), 0 8px 24px rgba(16,24,40,.08); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0f1115; --card:#171a20; --fg:#eceef2; --muted:#9aa0ab; --line:#2a2f38; --soft:#1e222a;
          --acc:#6f9bff; --acc-fg:#0b1020; --err:#ff8a80; --err-soft:#3a1c1c; --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.3); } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; font:15px/1.55 "Be Vietnam Pro", system-ui, "Segoe UI", Arial, sans-serif;
         background:radial-gradient(1200px 600px at 10% -10%, color-mix(in srgb, var(--acc) 12%, transparent), transparent), var(--bg); color:var(--fg); }
  form { width:100%; max-width:380px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:28px; box-shadow:var(--shadow); }
  .logo { width:44px; height:44px; border-radius:12px; background:var(--acc); color:var(--acc-fg); display:grid; place-items:center; margin-bottom:16px; }
  h1 { font-size:20px; margin:0 0 4px; letter-spacing:-.01em; } p { margin:0 0 20px; color:var(--muted); font-size:13.5px; }
  label { display:block; margin:14px 0 6px; font-size:13px; font-weight:600; }
  input { width:100%; font:inherit; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--soft); color:var(--fg); }
  input:focus { outline:2px solid var(--acc); outline-offset:-1px; background:var(--card); }
  button { width:100%; margin-top:22px; padding:11px; font:inherit; font-weight:600; border:0; border-radius:10px; background:var(--acc); color:var(--acc-fg); cursor:pointer; }
  button:hover { filter:brightness(1.08); }
  .loi { display:none; margin-top:14px; padding:9px 12px; border-radius:9px; background:var(--err-soft); color:var(--err); font-size:13.5px; }
</style>
</head>
<body>
<form method="post" action="/dang-nhap">
  <div class="logo" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></div>
  <h1>Nhận dạng chữ viết tay tiếng Việt</h1>
  <p>Đăng nhập để sử dụng hệ thống.</p>
  <label for="ten">Tên đăng nhập</label>
  <input id="ten" name="ten" autocomplete="username" required autofocus>
  <label for="mk">Mật khẩu</label>
  <input id="mk" name="mat_khau" type="password" autocomplete="current-password" required>
  <button type="submit">Đăng nhập</button>
  <div class="loi" id="loi" role="alert">Sai tên đăng nhập hoặc mật khẩu.</div>
</form>
<script>if (new URLSearchParams(location.search).has("loi")) document.getElementById("loi").style.display = "block";</script>
</body>
</html>
